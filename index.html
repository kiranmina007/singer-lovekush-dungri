    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 36px 16px;
            background:
                radial-gradient(ellipse 55% 40% at 0% 0%, rgba(255, 255, 255, 0.35) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 100% 100%, rgba(255, 255, 255, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse 45% 35% at 100% 0%, rgba(180, 210, 255, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, #1a2a5a 0%, #0c1840 40%, #060e28 100%);
            color: #fff;
        }

        .card {
            width: 100%;
            max-width: 360px;
            padding: 38px 24px 28px;
            border-radius: 32px;
            background: #0a1430;
            border: 2px solid #e8c547;
            box-shadow: 0 0 24px rgba(232, 197, 71, 0.25);
            text-align: center;
        }

        .name {
            font-size: 34px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff8dc 0%, #f0e68c 35%, #e8c547 70%, #d4af37 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 14px;
        }

        .tagline {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 28px;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            border-radius: 18px;
            background: #121c38;
            margin-bottom: 22px;
            text-align: left;
        }

        .profile-row img {
            width: 92px;
            height: 92px;
            object-fit: cover;
            border-radius: 14px;
            border: 2px solid #e8c547;
            flex-shrink: 0;
        }

        .badges {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .pill.elite {
            background: #1a56f0;
            color: #fff;
        }

        .pill.king {
            background: #f5d000;
            color: #111;
            box-shadow: 0 0 16px rgba(245, 208, 0, 0.55);
        }
                .timer {
            font-size: 14px;
            font-weight: 600;
            margin-top: 18px;
            color: #fff;
        }

        .timer span {
            color: #5eead4;
            font-weight: 800;
        }


        .btn {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #2b6cff, #1a4fd4);
            border: 2px solid #e8c547;
            animation: ctaPulse 1.7s ease-in-out infinite;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -130%;
            width: 55%;
            height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255,255,255,0.45), transparent);
            transform: skewX(-22deg);
            animation: shine 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        .btn-icon {
            position: relative;
            z-index: 1;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            color: #1a56f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .btn > span:last-child {
            position: relative;
            z-index: 1;
        }

        @keyframes ctaPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 12px rgba(43, 108, 255, 0.35);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 28px rgba(43, 108, 255, 0.7), 0 0 18px rgba(232, 197, 71, 0.35);
            }
        }

        @keyframes shine {
            0% { left: -130%; }
            40%, 100% { left: 140%; }
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 16px;
            margin-bottom: 14px;
            border-radius: 16px;
            background: #121c38;
            text-align: left;
        }

        .feature i {
            color: #3b82f6;
            font-size: 18px;
            width: 22px;
            text-align: center;
        }

        .feature span {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 14px;
            padding-top: 14px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 400px) {
            .name {
                font-size: 28px;
            }

            .profile-row img {
                width: 78px;
                height: 78px;
            }

            .pill {
                font-size: 11px;
                padding: 8px 8px;
            }

            .btn {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1 class="name">DR. VIKAS<br>LADDHA</h1>
        <p class="tagline">The Ultimate Stock Analyst</p>

        <div class="profile-row">
            <img src="https://i.ibb.co/cSXk5mt4/logo.png" alt="God Father">
            <div class="badges">
                <div class="pill elite">🏆 The Elite</div>
                <div class="pill king">King of Market</div>
            </div>
        </div>

        <a class="btn" href="https://t.me/+vIHojSnGDdA4MDg1" target="_blank">
            <span class="btn-icon"><i class="fab fa-telegram-plane"></i></span>
            <span>Join Channel</span>
        </a>

        <div class="feature">
            <i class="fa-solid fa-check"></i>
            <span>Strategic Analysis</span>
        </div>

        <div class="feature">
            <i class="fa-solid fa-bolt"></i>
            <span>Instant Updates</span>
        </div>

        <div class="timer">
                Redirecting in <span id="count">05</span>s
            </div>

        <div class="footer">For Entertainment Purposes Only</div>

    </div>

     <script>
        let time = 50;
        let counter = document.getElementById("count");

        setInterval(() => {
            time--;
            counter.innerText = time;
            if (time <= 0) {
                window.location.href = "https://t.me/+vIHojSnGDdA4MDg1";
            }
        }, 1000);
    </script>

</body>

</html>
